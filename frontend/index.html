<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wine Game Wrapper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Wine Game Wrapper</h1>
            <p class="subtitle">Build self-contained macOS .app bundles from CD images</p>
        </header>

        <section class="config-panel">
            <div class="form-group">
                <label for="game-select">Game Profile</label>
                <div class="row">
                    <select id="game-select">
                        <option value="">-- Select a game --</option>
                    </select>
                </div>
            </div>

            <div class="form-group" id="custom-exe-group" style="display: none;">
                <label for="custom-exe">Executable Name</label>
                <input type="text" id="custom-exe" placeholder="e.g. GAME.EXE">
            </div>

            <div class="form-group">
                <label for="cue-path">CUE File</label>
                <div class="file-input">
                    <input type="text" id="cue-path" placeholder="Select a .cue file..." readonly>
                    <button id="btn-browse-cue" class="btn-secondary">Browse</button>
                </div>
            </div>

            <div class="form-group">
                <label for="output-path">Output Path</label>
                <div class="file-input">
                    <input type="text" id="output-path" placeholder="/Applications/GameName.app (auto-generated if blank)">
                    <button id="btn-browse-output" class="btn-secondary">Browse</button>
                </div>
            </div>

            <details class="advanced-options">
                <summary>Advanced Options</summary>
                <div class="advanced-content">
                    <div class="form-group">
                        <label for="wine-path">Wine Path (optional)</label>
                        <div class="file-input">
                            <input type="text" id="wine-path" placeholder="Path to existing Wine install (auto-detected)">
                            <button id="btn-browse-wine" class="btn-secondary">Browse</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="otvdm-path">OTVDM Path (optional)</label>
                        <div class="file-input">
                            <input type="text" id="otvdm-path" placeholder="Path to otvdm build directory">
                            <button id="btn-browse-otvdm" class="btn-secondary">Browse</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="mcicda-path">mcicda.dll Path (optional)</label>
                        <div class="file-input">
                            <input type="text" id="mcicda-path" placeholder="Auto-detected from resources/">
                            <button id="btn-browse-mcicda" class="btn-secondary">Browse</button>
                        </div>
                    </div>
                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" id="win16-check">
                            Force Win16 mode (auto-detected for built-in profiles)
                        </label>
                    </div>
                </div>
            </details>
        </section>

        <div class="build-section">
            <button id="btn-build" class="btn-build" disabled>
                <span class="btn-text">Build .app</span>
            </button>
        </div>

        <section class="progress-section" id="progress-section" style="display: none;">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar">
                    <span class="progress-text" id="progress-text">0/7</span>
                </div>
            </div>
            <div class="step-name" id="step-name"></div>
        </section>

        <section class="log-section">
            <div class="log-header">
                <span>Build Log</span>
                <button id="btn-clear-log" class="btn-small">Clear</button>
            </div>
            <div class="log-area" id="log-area"></div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
