# Civilization II Multiplayer Gold Edition (1998) — Win32, InstallShield 5 CD.
# Game files are extracted from data1.cab (requires: brew install unshield).
# The game reads throne-room and wonder videos from the CD at runtime, so
# those directories are bundled and mapped as drive d:.
name = "Civilization II"
slug = "civ2"
exe = "civ2.exe"
win16 = false
game_dir = "Civ2"
theme = "auto"  # follow the macOS light/dark appearance for menus/dialogs/chrome
install = "extract-installshield"
# CD-check markers only. The label must match the real disc (the game scans
# CD-ROM drives for it) and a few small root files stand in as the disc.
# The KINGS/VIDEO movie dirs are intentionally NOT retained: they are Intel
# Indeo AVIs that Wine can't render, and shipping them makes the game hang on
# the intro/wonder/council movies. Without them the game skips movies and
# plays fine. See TODO: getting the movies to actually render under Wine.
retain_cd = [
  "Civ2/civ2.exe",
  "DATA.TAG",
  "lang.dat",
  "os.dat",
  "layout.bin",
]
cd_label = "Civ2:MGE v1.0"

# Remap 789/uo/jkl to the numpad for unit movement (same layout as CivNet;
# i left alone for Irrigate).
[[keymap]]
from = "7"
to = "num7"
[[keymap]]
from = "8"
to = "num8"
[[keymap]]
from = "9"
to = "num9"
[[keymap]]
from = "u"
to = "num4"
[[keymap]]
from = "o"
to = "num6"
[[keymap]]
from = "j"
to = "num1"
[[keymap]]
from = "k"
to = "num2"
[[keymap]]
from = "l"
to = "num3"
