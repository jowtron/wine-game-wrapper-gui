# Sid Meier's Civilization III: Complete (2003 Conquests engine) — Win32.
#
# Built from the DRM-free GOG install (setup_civilization3_complete_*.exe),
# extracted with innoextract. The retail discs are SafeDisc-protected and
# won't run under Wine; GOG ships the de-protected game, so this profile uses
# install = "copy-source-dir" and points -src at the extracted game folder.
#
# IMPORTANT — the GOG "Complete" package contains only ONE playable engine:
# Conquests (Civ3Conquests.exe). There is no separate base-game or Play-the-
# World game exe (only their world-builder editors survive). Conquests is a
# strict superset: base Civ3 and PTW rulesets + scenarios are all reachable
# from inside Conquests' New Game / Scenarios menus.
#
# BUT Conquests' folder is NOT self-contained: its path resolver searches
# three roots — its own dir (CWD), then the PTW and base-game install dirs
# read from HKLM registry Install_Path values. Files like Text\version.txt
# and art\PopUpAndMenuBackground.pcx exist ONLY in the base tree. With a
# Conquests-only install every miss becomes an "Unable to find file" popup,
# and the first such popup fires BEFORE labels.txt is loaded, so the popup
# code dereferences the NULL labels array -> the 0x5cdbe6 init crash that
# blocked this port. The fix is to ship the WHOLE GOG app/ tree (base +
# civ3PTW + Conquests) and seed the two Install_Path registry values below,
# exactly like a real Windows install. So -src points at the app/ ROOT:
#
#   .../wine-game-wrapper-gui build -game civ3 \
#     -src "$HOME/Library/Application Support/wine-game-wrapper/build-inputs/masters/civ3/app"
#
# GOG converted the CD audio to in-game MP3s (Sounds/), so there is no CD
# audio to wire up (no retain_cd / cd_label).
name = "Civilization III Complete"
slug = "civ3"
exe = "Conquests/Civ3Conquests.exe"
win16 = false
game_dir = "Civ3"
theme = "auto"  # follow the macOS light/dark appearance for menus/dialogs/chrome
install = "copy-source-dir"

# NO Wine virtual desktop. This is the opposite of ToT/SMAC and is REQUIRED:
# inside a virtual desktop, Civ3's Miles Sound System streaming thread
# PostMessage()s to a window Wine then rejects, and the game hangs forever
# spamming its own "PostMesage Fail!" debug string (296+/run, verified). With
# the virtual desktop OFF and KeepRes=1 set (see the conquests.ini overlay
# below), the window is valid, PostMessage succeeds, and the game reaches the
# menu cleanly. desktop = "none" makes prefix.go skip the Explorer\Desktop keys.
# This is the CrossOver-published, macOS-Sequoia-tested recipe.
desktop = "none"

# innoextract dumps the files the GOG installer would place into the install
# tree under __support/save/ (LSANS.TTF for all three roots — the game font,
# probed next to the exe; "Error loading font (Error Code: 13)" without it —
# plus Conquests' master ruleset conquests.biq and conquests.mb, which exist
# NOWHERE else in the package). Merge that staging dir onto the tree exactly
# like the real installer does.
[[merge]]
from = "__support/save"
to = "."

# The resolver's base-game and PTW roots (see the header comment). The game
# is 32-bit, so under the wow64 prefix it reads HKLM\Software through the
# Wow6432Node view — seed both views to be safe.
[[registry]]
key = 'HKEY_LOCAL_MACHINE\Software\Wow6432Node\Infogrames Interactive\Civilization III'
name = "Install_Path"
value = 'C:\Civ3'

[[registry]]
key = 'HKEY_LOCAL_MACHINE\Software\Wow6432Node\Infogrames\Civ3PTW'
name = "Install_Path"
value = 'C:\Civ3\civ3PTW'

[[registry]]
key = 'HKEY_LOCAL_MACHINE\Software\Infogrames Interactive\Civilization III'
name = "Install_Path"
value = 'C:\Civ3'

[[registry]]
key = 'HKEY_LOCAL_MACHINE\Software\Infogrames\Civ3PTW'
name = "Install_Path"
value = 'C:\Civ3\civ3PTW'

# Ship Civ3's config with the confirmed launch recipe. The overlay mirrors the
# game tree: Conquests/conquests.ini sits next to the exe (the game reads and
# rewrites .\conquests.ini at runtime), and Conquests/Text/version.txt supplies
# the #LANGUAGE section (0 = English) that init reads — the GOG package ships
# no version.txt in the Conquests tree, and a real install resolves it from
# the PTW dir. Ours takes first-root priority, which is safe.
#   KeepRes=1     run borderless at the current resolution (no display-mode
#                 change) — fixes the launch self-exit AND keeps the Miles
#                 window valid (with no virtual desktop). THE load-bearing fix.
#   PlayIntro=0   skip the intro Bink movie (it hangs / blocks the main menu).
#   Music Volume=90 + SFX Volume=128  both ON. Music shipped OFF until
#                 2026-07-31 because it wedged the audio system a few minutes
#                 into a game; that defect is now fixed at its source by the
#                 sound.dll hexpatch below, so music is on by default again.
# NOTE (likely next wall): if terrain renders BLACK once a game starts, that is
# WineHQ bug 41930 (Civ3's OpenGL-into-DIB path). The macOS fix is the C3X exe
# mod's "draw_lines_using_gdi_plus = wine" (GDI+ instead of OpenGL); the Linux
# OSMesa-removal trick does NOT apply to winemac/Metal. Not bundled yet.
[[overlay]]
source = "civ3"

# Audio-teardown fix (root-caused and verified 2026-07-31). With music on, all
# sound died a few minutes into a game leaving the last buffer looping, the
# game stayed playable, and quitting then hung forever at ~100% CPU.
#
# Root cause — a live-lock in sound.dll's mixer, NOT the PostMessage retry
# loops the earlier attempt blamed (across three wedges, one soaked 3.5 hours,
# "PostMesage Fail!" was printed ZERO times). sound.dll drives all audio from a
# winmm multimedia-timer callback (timeSetEvent at VA 0x10008dc1, callback
# 0x10008f70) which takes the global audio critical section and walks the
# stream list. Inside the mixer fill routine the loop below never terminates
# once a source stream runs dry:
#
#   0x10038b7a  eax = remaining            (non-zero: output still wanted)
#   0x10038b80  jne 0x1003885d
#   0x10038865  ecx = remaining + srcpos   (> limit)
#   0x1003886a  jbe -> not taken
#   0x10038871  eax = limit - srcpos       -> 0   (nothing available)
#   0x1003887d  [ebp+0x13a4] == 0 -> je 0x100388a0
#   0x100388a0  test eax,eax               -> 0
#   0x100388a2  je 0x10038b7a              -> back to the top, nothing changed
#
# Measured live on the wedged process: the critical section at sound+0xb3a08
# read RecursionCount=1 OwningThread=0x118, and the callback's reentrancy guard
# at sound+0xb3a20 was latched at 1 — i.e. the callback entered and never
# returned. That single fault explains every symptom: one shared service
# routine, so music and SFX die together; wine_dsound_mixer keeps replaying its
# last buffer; the game's main thread is untouched so play continues; and the
# shutdown path at 0x10008e10 does EnterCriticalSection on that same lock
# BEFORE timeKillEvent, so quitting blocks forever behind the spinning thread.
# It is self-reinforcing too: the "refill me" notification is posted after the
# walk, so the feeder thread is never woken and the source stays dry.
#
# The fix retargets the no-data-available branch from the loop test to the
# function's own normal exit (0x10038b86, the path already taken when the
# routine is asked for zero bytes), so an underrun returns short instead of
# retrying forever. Worst case one mixer block's tail goes unfilled.
#
# NOT the reverted f555e79 patch: that one NOP'd retry `je`s in the TEARDOWN
# paths (offsets 177682/177964/178156/178979) and fell through into epilogues
# that kill the timer and zero the stream handles — which is why it silenced
# all audio and still hung on exit. This touches no teardown code.
[[hexpatch]]
file = "Conquests/sound.dll"
desc = "audio live-lock: mixer underrun returns short instead of spinning (VA 0x100388a2)"
expect_size = 454656
offset = 231586
expect = [0x0F, 0x84, 0xD2, 0x02, 0x00, 0x00]
replace = [0x0F, 0x84, 0xDE, 0x02, 0x00, 0x00]

# 789/uo/jkl -> numpad keymap for unit movement (Macs without a numpad).
# HISTORY: an earlier session measured keyhook.exe re-triggering the Miles
# "PostMesage Fail!" hang (~196 fails/run) and banned the keymap — but that
# was measured against a game still crashing mid-init (the labels/version.txt
# bug). Re-tested 2026-07-30 against the fixed full-tree install: 0 PostMesage
# fails over 3+ min with the hook active. If the hang ever resurfaces, this
# keymap block is the first thing to remove.
[[keymap]]
from = "7"
to = "num7"
[[keymap]]
from = "8"
to = "num8"
[[keymap]]
from = "9"
to = "num9"
[[keymap]]
from = "u"
to = "num4"
[[keymap]]
from = "o"
to = "num6"
[[keymap]]
from = "j"
to = "num1"
[[keymap]]
from = "k"
to = "num2"
[[keymap]]
from = "l"
to = "num3"
