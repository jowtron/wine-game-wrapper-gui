# Sid Meier's Colonization for Windows (1995) — Win16.
# The Windows game lives unpacked in the CD's INSTALL/ directory, except
# colonize.exe which is ARCV-compressed (COLONIZE.$00) — the install engine
# expands ARCV archives automatically, so no installer run is needed.
name = "Colonization"
slug = "colonization"
exe = "COLONIZE.EXE"
win16 = true
game_dir = "COLONIZE"
install = "copy-dir:INSTALL"
theme = "auto"  # follow the macOS light/dark appearance for menus/dialogs/chrome

# Remap 789/uo/jkl to the numpad for unit movement (same layout as CivNet).
[[keymap]]
from = "7"
to = "num7"
[[keymap]]
from = "8"
to = "num8"
[[keymap]]
from = "9"
to = "num9"
[[keymap]]
from = "u"
to = "num4"
[[keymap]]
from = "o"
to = "num6"
[[keymap]]
from = "j"
to = "num1"
[[keymap]]
from = "k"
to = "num2"
[[keymap]]
from = "l"
to = "num3"
